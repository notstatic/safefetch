[project]
name = "safefetch"
version = "0.1.0"
description = "HTTP calls that stay inside rate limits, retry sensibly, and back off when a service is failing"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Niko Kärenlampi", email = "niko.karenlampi@gmail.com" }]
keywords = ["http", "rate-limiting", "retry", "circuit-breaker", "throttle"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
redis = ["redis>=5.0"]
httpx = ["httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/notstatic/safefetch"
Issues = "https://github.com/notstatic/safefetch/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
python_version = "3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = []

[tool.hatch.build.targets.wheel]
packages = ["src/safefetch"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
]
